[project]
name = "blurt"
version = "0.5.0"
description = "Talk anywhere you can type. Press a shortcut, say it, and Blurt types clean, filler-free text into whatever app you are in."
requires-python = ">=3.14,<3.15"
authors = [{ name = "Ralph Najem", email = "me@ralphnajem.com" }]
dependencies = [
    "httpx>=0.28",
    "sounddevice>=0.5",
]

[project.urls]
Homepage = "https://github.com/ralphnajm/blurt"

[project.scripts]
blurt = "blurt.cli:main"

[tool.poetry]
packages = [{ include = "blurt" }]

[tool.poetry.group.dev.dependencies]
mypy = "^1.18"
ruff = "^0.14"
pillow = "^12.3"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
