[package]
name = "blurt"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
description = "Talk anywhere you can type: hold a key, say it, and Blurt types clean, filler-free text"
license = "LicenseRef-Proprietary"
repository = "https://github.com/ralphnajm/blurt"
readme = "README.md"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
fancy-regex = "0.20.1"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
libsecret = "0.9.0"
pangocairo = "0.22.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Widget construction functions are long by nature.
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
dbg_macro = "warn"
todo = "warn"

# Packaging: `cargo deb` (Debian/Ubuntu) and `cargo generate-rpm` (Fedora).
# Both expect `cargo build --release` to have run first.
[package.metadata.deb]
name = "blurt"
maintainer = "Ralph Najem <me@ralphnajem.com>"
section = "utils"
priority = "optional"
depends = "$auto, gnome-shell (>= 46), wl-clipboard, gnome-session-canberra"
extended-description = "Hold a key, say it, and Blurt types clean, filler-free text into whatever app has focus on your GNOME desktop. Speech is transcribed with OpenAI when you let go, cleaned of fillers and false starts, and handed to GNOME's input method. A settings window keeps the API key in the GNOME keyring and tracks spend against a monthly budget, and a top bar menu starts and stops dictation."
maintainer-scripts = "packaging/deb/"
assets = [
    ["target/release/blurt", "usr/bin/", "755"],
    ["data/blurt.service", "usr/lib/systemd/user/", "644"],
    ["data/dev.blurt.Blurt.desktop", "usr/share/applications/", "644"],
    ["data/dev.blurt.Blurt.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/16x16/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["data/icons/hicolor/24x24/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["data/icons/hicolor/32x32/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["data/icons/hicolor/48x48/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["data/icons/hicolor/64x64/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["data/icons/hicolor/128x128/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/dev.blurt.Blurt.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["data/gnome-shell/blurt@dev.blurt/*", "usr/share/gnome-shell/extensions/blurt@dev.blurt/", "644"],
    ["data/gnome-shell/blurt@dev.blurt/icons/*", "usr/share/gnome-shell/extensions/blurt@dev.blurt/icons/", "644"],
]

[package.metadata.generate-rpm]
summary = "Talk anywhere you can type"
assets = [
    { source = "target/release/blurt", dest = "/usr/bin/blurt", mode = "755" },
    { source = "data/blurt.service", dest = "/usr/lib/systemd/user/blurt.service", mode = "644" },
    { source = "data/dev.blurt.Blurt.desktop", dest = "/usr/share/applications/dev.blurt.Blurt.desktop", mode = "644" },
    { source = "data/dev.blurt.Blurt.metainfo.xml", dest = "/usr/share/metainfo/dev.blurt.Blurt.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/*/apps/dev.blurt.Blurt.png", dest = "/usr/share/icons/hicolor/", mode = "644" },
    { source = "data/gnome-shell/blurt@dev.blurt/*", dest = "/usr/share/gnome-shell/extensions/blurt@dev.blurt/", mode = "644" },
    { source = "data/gnome-shell/blurt@dev.blurt/icons/*", dest = "/usr/share/gnome-shell/extensions/blurt@dev.blurt/icons/", mode = "644" },
]
post_install_script = "packaging/rpm/post-install.sh"
pre_uninstall_script = "packaging/rpm/pre-uninstall.sh"
# Use rpm-build's find-requires: the built-in scanner emits glibc requirements dnf cannot resolve.
auto-req = "find-requires"

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.14"
libadwaita = ">= 1.5"
libsecret = "*"
alsa-lib = "*"
wl-clipboard = "*"
libcanberra-gtk3 = "*"
gnome-shell = ">= 46"
